name: GitHub Pages build and deploy

on:
  push:
    branches:
      - core-backend-foundation
  pull_request:
    branches:
      - main
      - core-backend-foundation

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/site-3d.js
          python3 scripts/check_graphics_runtime.py
          node --check assets/js/ai-world-navigation.js
          node --check assets/js/registry-client.js
          node --check assets/js/generations.js
          node --check assets/js/events-registry.js
          node --check assets/js/family-portraits.js
          node --check assets/js/media-library.js
          node --check assets/js/site-guide.js
          node --check assets/js/places-gallery.js
          node --check assets/js/family-board-map.js
          node --check assets/js/ai-media-enhancer.js
          node --check assets/js/media-atmosphere.js
          node --check assets/js/cloud-archive.js
          node --check neon/functions/aistatus/index.mjs
      - name: Compile AI media worker and API syntax
        run: python3 -m py_compile backend/app/ai_media_worker.py backend/app/cloud_archive_api.py
      - name: Check AI media lab integration
        run: python3 scripts/check_ai_media_lab.py
      - name: Check AI world portal contract
        run: python3 scripts/check_ai_world.py
      - name: Check media viewer interface contract
        run: python3 scripts/check_media_viewer.py
      - name: Check generated pages and local links
        run: python3 scripts/check_pages_links.py ./_site
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/core-backend-foundation'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
