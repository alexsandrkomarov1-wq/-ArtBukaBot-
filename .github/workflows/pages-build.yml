name: GitHub Pages build

on:
  push:
    branches:
      - core-backend-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check media viewer JavaScript syntax
        run: node --check assets/js/media-library.js && node --check assets/js/site-guide.js && node --check assets/js/places-gallery.js
      - name: Check media viewer interface contract
        run: python3 scripts/check_media_viewer.py
      - name: Check generated pages and local links
        run: python3 scripts/check_pages_links.py _site
