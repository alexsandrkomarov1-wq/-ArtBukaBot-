name: KOMAROVA_CORE agent self-test

on:
  push:
    branches:
      - core-backend-foundation
  pull_request:
    branches:
      - core-backend-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-self-test:
    runs-on: windows-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Install pinned PowerShell 7.7.0
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "PowerShell-7.7.0-win-x64.zip"
          $installDir = Join-Path $env:RUNNER_TEMP "PowerShell-7.7.0"
          Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v7.7.0/PowerShell-7.7.0-win-x64.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $installDir -Force
          $installDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned PowerShell version
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion -ne [version]"7.7.0") { throw "Expected PowerShell 7.7.0, got $($PSVersionTable.PSVersion)" }
          $PSVersionTable.PSVersion.ToString()
      - name: Test local time logger in isolated temporary directory
        shell: pwsh
        run: ./tools/test-komarova-core.ps1
      - name: Test multi-project control center in isolated temporary directory
        shell: pwsh
        run: ./tools/test-project-control.ps1
