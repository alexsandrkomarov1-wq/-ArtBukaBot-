name: Backend tests

on:
  push:
    branches:
      - main
      - core-backend-foundation
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: komarova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d komarova_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/komarova_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check JavaScript syntax
        run: node --check assets/js/site-guide.js && node --check assets/js/media-library.js && node --check assets/js/places-gallery.js
      - name: Run backend tests
        run: pytest -q
