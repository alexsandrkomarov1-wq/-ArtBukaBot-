name: Backend tests

on:
  push:
    branches:
      - main
      - core-backend-foundation
      - feature/neon-postgres-readiness
  pull_request:
    branches:
      - main
      - core-backend-foundation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Check JavaScript syntax
        run: node --check assets/js/site-guide.js && node --check assets/js/media-library.js && node --check assets/js/places-gallery.js
      - name: Run backend tests
        run: pytest -q
